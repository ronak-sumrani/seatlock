spring:
  application:
    name: user-catalog-service
  threads:
    virtual:
      # Blocking Spring MVC on virtual threads (spec §3): Tomcat runs each request on a virtual thread,
      # so blocking JDBC/HTTP calls park cheaply instead of tying up a platform thread.
      enabled: true
  config:
    # The repo-root .env is KEY=value, which is valid .properties. There are two paths because
    # `spring-boot:run -pl` runs with the module directory as cwd, while `java -jar` from the
    # root does not. Real environment variables still win over both.
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${POSTGRES_DB:seatlock}
    # One role for this deployable (spec §3/§4): it owns schemas auth and catalog and has no
    # rights anywhere else.
    username: user_catalog_user
    # No default on purpose, so startup fails fast if the password is missing.
    password: ${USER_CATALOG_DB_PASSWORD}
  flyway:
    # One Flyway history for both modules' schemas. If auth is ever split out, it gets its own role
    # and history.
    schemas: catalog,auth
    # flyway_schema_history lives in catalog, owned by user_catalog_user.
    default-schema: catalog
    # The role isn't allowed to create schemas; the Postgres init script already did it.
    create-schemas: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Adds /actuator/health/liveness and /readiness for Compose healthchecks later.
      probes:
        enabled: true
